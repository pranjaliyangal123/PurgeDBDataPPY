# Application Configuration
spring.application.name=purge-archive-batch

# Main Database Configuration (Production DB)
spring.datasource.main.url=jdbc:mysql://localhost:3306/production_db
spring.datasource.main.username=db_user
spring.datasource.main.password=db_password
spring.datasource.main.driver-class-name=com.mysql.cj.jdbc.Driver

# Archive Database Configuration (Archive DB)
spring.datasource.archive.url=jdbc:mysql://localhost:3306/archive_db
spring.datasource.archive.username=db_user
spring.datasource.archive.password=db_password
spring.datasource.archive.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Batch Processing Configuration
batch.chunk.size=1000
batch.retry.limit=3
batch.skip.limit=10

# Retention Policy Configuration (in days)
retention.policy.fsl-request-event=7
retention.policy.event-log-table=7
retention.policy.request-event=15
retention.policy.replay=15

# Logging Configuration
logging.level.root=INFO
logging.level.com.purgedb=DEBUG
logging.level.org.springframework.batch=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/purge-archive.log
logging.file.max-size=10MB
logging.file.max-history=30

# Purge Archive Scheduler Configuration
purge.archive.scheduler.enabled=false
purge.archive.scheduler.cron=0 0 2 * * ?

# Actuator endpoints (for monitoring)
management.endpoints.web.exposure.include=health,metrics,info
