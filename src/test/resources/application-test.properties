# Test Configuration with H2 Database
spring.application.name=purge-archive-batch-test

# Main Database Configuration (H2 In-Memory)
spring.datasource.main.url=jdbc:h2:mem:testdb_main;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.main.username=sa
spring.datasource.main.password=
spring.datasource.main.driver-class-name=org.h2.Driver

# Archive Database Configuration (H2 In-Memory)
spring.datasource.archive.url=jdbc:h2:mem:testdb_archive;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.archive.username=sa
spring.datasource.archive.password=
spring.datasource.archive.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Batch Processing Configuration
batch.chunk.size=100
batch.retry.limit=3
batch.skip.limit=5

# Retention Policy Configuration (in days)
retention.policy.fsl-request-event=7
retention.policy.event-log-table=7
retention.policy.request-event=15
retention.policy.replay=15

# Logging Configuration
logging.level.root=INFO
logging.level.com.purgedb=DEBUG
logging.level.org.springframework.batch=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
